<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="oklch(7% 0.012 245)"/>
      <stop offset="100%" stop-color="oklch(11% 0.016 245)"/>
    </linearGradient>
    <linearGradient id="accent-glow" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-opacity="0.03" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Emerald accent glow top-right -->
  <ellipse cx="950" cy="200" rx="400" ry="300" fill="#34d399" fill-opacity="0.06"/>

  <!-- Shuttle icon -->
  <text x="96" y="210" font-size="72" font-family="system-ui">🏸</text>

  <!-- App name -->
  <text x="96" y="310"
    font-family="'Barlow Condensed', 'Barlow Semi Condensed', system-ui, sans-serif"
    font-weight="900"
    font-size="80"
    fill="white"
    letter-spacing="-2">
    Badminton Queue
  </text>

  <!-- Tagline -->
  <text x="96" y="376"
    font-family="system-ui, -apple-system, sans-serif"
    font-weight="400"
    font-size="28"
    fill="white"
    fill-opacity="0.55"
    letter-spacing="0">
    Smart matchmaking · Real-time courts · Fair rotations
  </text>

  <!-- Divider -->
  <rect x="96" y="418" width="60" height="3" rx="2" fill="#34d399" fill-opacity="0.7"/>

  <!-- Stats row -->
  <text x="96" y="480"
    font-family="system-ui, -apple-system, sans-serif"
    font-weight="600"
    font-size="22"
    fill="#34d399">
    0 empty courts
  </text>
  <text x="96" y="510"
    font-family="system-ui, -apple-system, sans-serif"
    font-weight="400"
    font-size="18"
    fill="white"
    fill-opacity="0.35">
    The engine fills every slot, every time.
  </text>

  <!-- Right side — phone mockup silhouette -->
  <rect x="840" y="80" width="220" height="460" rx="32" fill="white" fill-opacity="0.04" stroke="white" stroke-opacity="0.08" stroke-width="1.5"/>
  <!-- Notch -->
  <rect x="910" y="92" width="80" height="22" rx="11" fill="white" fill-opacity="0.06"/>
  <!-- Screen lines (fake content) -->
  <rect x="862" y="140" width="176" height="12" rx="6" fill="white" fill-opacity="0.08"/>
  <rect x="862" y="164" width="120" height="8" rx="4" fill="white" fill-opacity="0.05"/>
  <rect x="862" y="200" width="176" height="60" rx="8" fill="#34d399" fill-opacity="0.12"/>
  <!-- Big # numeral suggestion -->
  <text x="900" y="250"
    font-family="'Barlow Condensed', system-ui, sans-serif"
    font-weight="900"
    font-size="52"
    fill="#34d399"
    fill-opacity="0.5">#3</text>
  <rect x="862" y="278" width="176" height="8" rx="4" fill="white" fill-opacity="0.05"/>
  <rect x="862" y="298" width="100" height="8" rx="4" fill="white" fill-opacity="0.04"/>
  <!-- Bottom tabs -->
  <rect x="862" y="488" width="36" height="36" rx="6" fill="white" fill-opacity="0.06"/>
  <rect x="906" y="488" width="36" height="36" rx="6" fill="#34d399" fill-opacity="0.15"/>
  <rect x="950" y="488" width="36" height="36" rx="6" fill="white" fill-opacity="0.06"/>
  <rect x="994" y="488" width="36" height="36" rx="6" fill="white" fill-opacity="0.06"/>
</svg>
