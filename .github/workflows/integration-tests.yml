# ============================================================
# CI: Integration Tests — Badminton Queue App
# ============================================================
# Runs Vitest integration tests against a local Supabase instance
# spun up inside the CI runner via Docker + Supabase CLI.
#
# Test isolation:
#   • Tests run serially (singleFork: true) — no parallel DB conflicts.
#   • Layer B (truncateTracked) cleans up after each test.
#   • Layer C (supabase db reset) runs between suite files via pretest.
#
# Pinned versions (update deliberately — drift causes flakes):
#   • Node.js: 20 LTS
#   • Supabase CLI: pinned below (2.109.1) — see the install step
#
# Failure notifications:
#   GitHub emails the pusher automatically when this fails.
# ============================================================

name: Integration Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  integration:
    name: Vitest Integration
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Setup Node ────────────────────────────────────────
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── 3. Install dependencies ──────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Install Supabase CLI ──────────────────────────────
      # Pin to a specific major version for stability.
      # Supabase CLI requires Docker — ubuntu-latest includes Docker.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # PINNED ON PURPOSE. This used to say `latest`, which contradicted the
          # header above and broke the job twice: the JSON keys of
          # `supabase status --output json` changed between 1.x and 2.x (see the
          # next step), and resolving "latest" also hit
          # "Failed to resolve latest Supabase CLI release: rate limit exceeded"
          # on a shared runner. Bump this deliberately, and re-check the jq keys
          # below when you do.
          version: 2.109.1

      # ── 5. Start local Supabase ──────────────────────────────
      # Boots the full Supabase stack via Docker Compose.
      # Uses the supabase/ project config in the repo.
      # First run pulls images (~60s); subsequent runs reuse the cache.
      - name: Start local Supabase
        run: supabase start
        # Increase timeout to account for image pulls on cold runners.
        # Typical time: 60–90s on first pull, ~15s with cache.
        timeout-minutes: 5

      # ── 6. Write .env.integration ──────────────────────────────
      # Extract keys from `supabase status --output json` and write
      # them to tests/integration/.env for the test runner to load.
      - name: Write integration env file
        run: |
          set -euo pipefail
          SUPABASE_STATUS=$(supabase status --output json)

          # Accept BOTH key styles. CLI 1.x used spaced keys ("API URL",
          # "anon key", "service_role key", "DB URL"); 2.x uses SCREAMING_SNAKE
          # (API_URL, ANON_KEY, SERVICE_ROLE_KEY, DB_URL). Reading only the 1.x
          # names against a 2.x CLI is what broke this job: jq returned the
          # string "null", which was written verbatim into the env file, and the
          # run failed 40s later inside vitest with
          # "Failed to parse URL from null/rest/v1/" — pointing at the tests
          # rather than at this step. `// empty` gives a blank instead of "null"
          # so the guard below can actually catch it.
          SUPABASE_URL=$(echo "$SUPABASE_STATUS"      | jq -r '."API URL"          // .API_URL          // empty')
          ANON_KEY=$(echo "$SUPABASE_STATUS"          | jq -r '."anon key"         // .ANON_KEY         // empty')
          SERVICE_ROLE_KEY=$(echo "$SUPABASE_STATUS"  | jq -r '."service_role key" // .SERVICE_ROLE_KEY // empty')
          DB_URL=$(echo "$SUPABASE_STATUS"            | jq -r '."DB URL"           // .DB_URL           // empty')

          # Fail HERE, where the cause is visible, rather than handing a broken
          # env file to the test runner. Dumping the raw status makes the next
          # key rename a 30-second fix instead of an investigation.
          MISSING=""
          [ -n "$SUPABASE_URL" ]     || MISSING="$MISSING API_URL"
          [ -n "$ANON_KEY" ]         || MISSING="$MISSING ANON_KEY"
          [ -n "$SERVICE_ROLE_KEY" ] || MISSING="$MISSING SERVICE_ROLE_KEY"
          [ -n "$DB_URL" ]           || MISSING="$MISSING DB_URL"
          if [ -n "$MISSING" ]; then
            echo "::error::supabase status did not yield:$MISSING (CLI key names changed?)"
            echo "Raw \`supabase status --output json\`:"
            echo "$SUPABASE_STATUS"
            exit 1
          fi

          cat > tests/integration/.env <<EOF
          NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL
          NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY
          SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          DATABASE_URL=$DB_URL
          EOF

          echo "Integration env written:"
          echo "  SUPABASE_URL: $SUPABASE_URL"
          echo "  DB_URL: $DB_URL"

      # ── 7. Reset DB + run integration tests ─────────────────
      # supabase db reset re-applies all migrations from scratch,
      # guaranteeing a clean slate before the full suite.
      # global-setup also applies pending migrations, but this
      # layer ensures no cross-suite pollution from a prior run.
      # SKIP_DB_RESET=1 lets local devs skip the ~15s reset cost.
      # ── 6b. TEMPORARY diagnostic ────────────────────────────
      # The suite fails with "permission denied for table profiles" from a
      # SERVICE-ROLE client, which should be impossible if the fresh database
      # carries the same grants production has. Dump the actual grant state so
      # the fix is based on evidence rather than a guess — grants are security
      # surface and must mirror production exactly, not approximately.
      # REMOVE once the grant baseline is settled.
      - name: Diagnose grants (temporary)
        continue-on-error: true
        run: |
          set -uo pipefail
          DB_URL=$(grep '^DATABASE_URL=' tests/integration/.env | cut -d= -f2-)
          echo "== roles =="
          psql "$DB_URL" -c "select rolname, rolbypassrls, rolsuper from pg_roles where rolname in ('anon','authenticated','service_role','postgres','authenticator') order by rolname;"
          echo "== table grants on profiles / sessions / courts =="
          psql "$DB_URL" -c "select table_name, grantee, string_agg(distinct privilege_type,',' order by privilege_type) from information_schema.role_table_grants where table_schema='public' and table_name in ('profiles','sessions','courts') group by table_name, grantee order by table_name, grantee;"
          echo "== count of public tables with NO grant to service_role =="
          psql "$DB_URL" -c "select count(*) from pg_tables t where t.schemaname='public' and not exists (select 1 from information_schema.role_table_grants g where g.table_schema='public' and g.table_name=t.tablename and g.grantee='service_role');"
          echo "== default privileges in public =="
          psql "$DB_URL" -c "select pg_get_userbyid(defaclrole) as owner, defaclobjtype, defaclacl from pg_default_acl;"

      - name: Run integration tests
        run: |
          if [ -z "$SKIP_DB_RESET" ]; then
            echo "Resetting local DB before full suite run..."
            supabase db reset
          fi
          npm run test:integration
        env:
          SKIP_DB_RESET: "" # empty = always reset in CI

      # ── 8. Upload coverage (optional) ───────────────────────
      # Only uploads if tests pass. Useful for tracking coverage
      # trends over time without blocking on coverage thresholds.
      - name: Upload integration coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage
          path: coverage/integration/
          retention-days: 7

      # ── 9. Stop Supabase ──────────────────────────────────────
      # Explicit stop to release Docker resources cleanly.
      - name: Stop local Supabase
        if: always()
        run: supabase stop
